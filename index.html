<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2329">
  <title>さっと書く</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f3ed;
      --panel: #fffdf8;
      --text: #242424;
      --sub: #6d6a65;
      --line: #d8d2c8;
      --button: #ece6db;
      --button-hover: #e2dacd;
      --focus: #7b6751;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181a1d;
        --panel: #22252a;
        --text: #ececec;
        --sub: #a9a9a9;
        --line: #3a3e45;
        --button: #30343a;
        --button-hover: #3a3f46;
        --focus: #c1a57d;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic UI",
        "Yu Gothic", Meiryo, sans-serif;
    }

    body {
      min-height: 100dvh;
      padding:
        max(10px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
    }

    .app {
      width: min(100%, 980px);
      min-height: calc(100dvh - 20px);
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 9px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: .04em;
      white-space: nowrap;
    }

    #title {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 9px 11px;
      font: inherit;
      font-weight: 600;
      outline: none;
    }

    #title:focus, #editor:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 20%, transparent);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    button, .file-label {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--button);
      color: var(--text);
      padding: 8px 12px;
      font: inherit;
      font-size: .9rem;
      cursor: pointer;
      user-select: none;
    }

    button:hover, .file-label:hover { background: var(--button-hover); }
    button:active, .file-label:active { transform: translateY(1px); }

    input[type="file"] { display: none; }

    #editor {
      width: 100%;
      min-height: 0;
      resize: none;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      padding: 15px;
      outline: none;
      font-family:
        "BIZ UDPGothic", "Yu Gothic UI", "Yu Gothic",
        Meiryo, sans-serif;
      font-size: 17px;
      line-height: 1.8;
      tab-size: 4;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--sub);
      font-size: .82rem;
      padding: 0 3px;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    #count {
      cursor: pointer;
      user-select: none;
      border-bottom: 1px dotted var(--sub);
    }

    #count:hover {
      color: var(--text);
    }

    .brand {
      font-size: .72rem;
      letter-spacing: .12em;
      white-space: nowrap;
      opacity: .72;
    }

    .status-right { text-align: right; }

    @media (max-width: 560px) {
      body { padding: 8px; }
      .app { min-height: calc(100dvh - 16px); }
      header { align-items: stretch; flex-direction: column; gap: 6px; }
      h1 { font-size: .95rem; }
      button, .file-label { flex: 1 1 auto; text-align: center; }
      #editor { font-size: 16px; padding: 13px; }
      footer { font-size: .75rem; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>さっと書く</h1>
      <input id="title" type="text" placeholder="タイトル（任意）" autocomplete="off">
    </header>

    <nav class="toolbar" aria-label="操作">
      <button id="newBtn" type="button">新規</button>
      <button id="restoreBtn" type="button" title="直前の内容を復元">復元</button>
      <label class="file-label" for="openFile">開く</label>
      <input id="openFile" type="file" accept=".txt,.md,text/plain,text/markdown">
      <button id="saveBtn" type="button">保存</button>
      <button id="copyBtn" type="button">全文コピー</button>
    </nav>

    <textarea
      id="editor"
      spellcheck="false"
      placeholder="ここに書く。内容はこの端末のブラウザに自動保存されます。"></textarea>

    <footer>
      <div class="footer-left">
        <span id="count" title="クリックすると400字詰め原稿用紙換算を表示">0文字・1行</span>
        <span class="brand">HAL WORKS</span>
      </div>
      <span class="status-right" id="status">自動保存</span>
    </footer>
  </main>

  <script>
    (() => {
      "use strict";

      const STORAGE_TEXT = "quick_editor_text_v1";
      const STORAGE_TITLE = "quick_editor_title_v1";
      const BACKUP_TEXT = "quick_editor_backup_text_v1";
      const BACKUP_TITLE = "quick_editor_backup_title_v1";

      const editor = document.getElementById("editor");
      const title = document.getElementById("title");
      const count = document.getElementById("count");
      const status = document.getElementById("status");
      const openFile = document.getElementById("openFile");
      const newBtn = document.getElementById("newBtn");
      const saveBtn = document.getElementById("saveBtn");
      const copyBtn = document.getElementById("copyBtn");

      let saveTimer;
      let showManuscriptPages = false;

      function restore() {
        editor.value = localStorage.getItem(STORAGE_TEXT) ?? "";
        title.value = localStorage.getItem(STORAGE_TITLE) ?? "";
        updateCount();
      }

      function updateCount() {
        const text = editor.value;
        const chars = [...text].length;
        const lines = text === "" ? 1 : text.split(/\r\n|\r|\n/).length;

        if (showManuscriptPages) {
          const pages = chars / 400;
          const pageText = pages === 0
            ? "0枚"
            : `約${pages.toLocaleString("ja-JP", {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
              })}枚`;
          count.textContent = `400字詰め原稿用紙 ${pageText}`;
          count.title = "文字数・行数表示に戻す";
        } else {
          count.textContent = `${chars.toLocaleString("ja-JP")}文字・${lines.toLocaleString("ja-JP")}行`;
          count.title = "クリックすると400字詰め原稿用紙換算を表示";
        }
      }

      function autoSave() {
        clearTimeout(saveTimer);
        status.textContent = "保存中…";
        saveTimer = setTimeout(() => {
          try {
            localStorage.setItem(STORAGE_TEXT, editor.value);
            localStorage.setItem(STORAGE_TITLE, title.value);
            status.textContent = "自動保存済み";
          } catch (error) {
            status.textContent = "自動保存できません";
            console.error(error);
          }
        }, 250);
      }

      function safeFilename(name) {
        const cleaned = name
          .trim()
          .replace(/[\\/:*?"<>|]/g, "_")
          .replace(/\s+/g, " ");
        return cleaned || "メモ";
      }

      function downloadText() {
        const blob = new Blob([editor.value], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `${safeFilename(title.value)}.txt`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        status.textContent = "ファイルに保存しました";
      }

      async function copyAll() {
        try {
          await navigator.clipboard.writeText(editor.value);
          status.textContent = "全文をコピーしました";
        } catch {
          editor.focus();
          editor.select();
          document.execCommand("copy");
          editor.setSelectionRange(editor.value.length, editor.value.length);
          status.textContent = "全文をコピーしました";
        }
      }

      count.addEventListener("click", () => {
        showManuscriptPages = !showManuscriptPages;
        updateCount();
      });

      editor.addEventListener("input", () => {
        updateCount();
        autoSave();
      });

      title.addEventListener("input", autoSave);

      function saveBackup() {
        if (editor.value || title.value) {
          localStorage.setItem(BACKUP_TEXT, editor.value);
          localStorage.setItem(BACKUP_TITLE, title.value);
        }
      }

      newBtn.addEventListener("click", () => {
        if ((editor.value || title.value) &&
            !confirm("現在の内容をバックアップして、新しいメモを作りますか？")) {
          return;
        }
        saveBackup();
        editor.value = "";
        title.value = "";
        localStorage.removeItem(STORAGE_TEXT);
        localStorage.removeItem(STORAGE_TITLE);
        updateCount();
        status.textContent = "直前の内容をバックアップしました";
        editor.focus();
      });

      restoreBtn.addEventListener("click", () => {
        const backupText = localStorage.getItem(BACKUP_TEXT);
        const backupTitle = localStorage.getItem(BACKUP_TITLE);

        if (backupText === null && backupTitle === null) {
          status.textContent = "復元できるバックアップはありません";
          return;
        }

        if ((editor.value || title.value) &&
            !confirm("現在の内容を直前のバックアップで置き換えますか？")) {
          return;
        }

        editor.value = backupText || "";
        title.value = backupTitle || "";
        localStorage.setItem(STORAGE_TEXT, editor.value);
        localStorage.setItem(STORAGE_TITLE, title.value);
        updateCount();
        status.textContent = "直前の内容を復元しました";
        editor.focus();
      });

      saveBtn.addEventListener("click", downloadText);
      copyBtn.addEventListener("click", copyAll);

      openFile.addEventListener("change", async () => {
        const file = openFile.files?.[0];
        if (!file) return;

        try {
          saveBackup();
          editor.value = await file.text();
          title.value = file.name.replace(/\.[^.]+$/, "");
          updateCount();
          autoSave();
          status.textContent = `${file.name} を開きました`;
        } catch (error) {
          status.textContent = "ファイルを開けませんでした";
          console.error(error);
        } finally {
          openFile.value = "";
        }
      });

      window.addEventListener("keydown", event => {
        const modifier = event.ctrlKey || event.metaKey;

        if (modifier && event.key.toLowerCase() === "s") {
          event.preventDefault();
          downloadText();
        }

        if (modifier && event.key.toLowerCase() === "o") {
          event.preventDefault();
          openFile.click();
        }
      });

      restore();
      editor.focus();
    })();
  </script>
</body>
</html>
